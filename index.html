<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLMS - Gamified Learning System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Экран входа -->
    <div id="auth-screen" class="flex justify-center items-center h-screen px-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-indigo-600 mb-2">GLMS Portal</h1>
            <p class="text-sm text-gray-500 text-center mb-6">Образовательная платформа с геймификацией</p>

            <div class="flex border-b mb-6">
                <button id="tab-login" type="button" class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600">Вход</button>
                <button id="tab-register" type="button" class="flex-1 py-2 font-semibold text-gray-400">Регистрация</button>
            </div>

            <form id="auth-form">
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Имя пользователя</label>
                    <input type="text" id="auth-name" required value="Igilik Altair" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Пароль</label>
                    <input type="password" id="auth-password" required value="123456" class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition duration-150">Войти</button>
            </form>
        </div>
    </div>

    <!-- Главная панель управления -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- Шапка -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-xl text-indigo-600">GLMS</span>
                    <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-medium">Студент</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-display-name" class="font-medium text-sm text-gray-700">Igilik Altair</span>
                    <button id="btn-logout" type="button" class="text-xs text-red-500 hover:text-red-700 border border-red-200 px-2.5 py-1 rounded">Выйти</button>
                </div>
            </div>
        </header>

        <!-- Стата -->
        <div class="bg-indigo-900 text-white py-6 px-4">
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center font-bold text-xl border-2 border-indigo-300" id="stat-level-badge">1</div>
                    <div>
                        <div class="text-xs text-indigo-200 uppercase">Уровень</div>
                        <div class="font-semibold text-sm" id="stat-level-title">Новичок</div>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-indigo-200">Опыт (XP)</span>
                        <span id="stat-xp-text" class="font-mono">0 / 100 XP</span>
                    </div>
                    <div class="w-full bg-indigo-950 rounded-full h-3 overflow-hidden border border-indigo-700">
                        <div id="stat-xp-bar" class="bg-green-400 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <div class="flex justify-around md:justify-end md:space-x-8 text-center">
                    <div>
                        <div class="text-xs text-indigo-200">Баллы (PTS)</div>
                        <div id="stat-pts" class="text-xl font-bold text-yellow-400">0</div>
                    </div>
                    <div>
                        <div class="text-xs text-indigo-200">Значки</div>
                        <div id="stat-badges-count" class="text-xl font-bold text-indigo-100">0 / 3</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Навигация -->
        <div class="bg-white border-b">
            <div class="max-w-6xl mx-auto px-4 flex space-x-6 text-sm font-medium">
                <button id="nav-courses" type="button" class="py-3 border-b-2 border-indigo-600 text-indigo-600">Задания и Курсы</button>
                <button id="nav-leaderboard" type="button" class="py-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700">Таблица лидеров</button>
                <button id="nav-achievements" type="button" class="py-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700">Достижения</button>
            </div>
        </div>

        <!-- страницы -->
        <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
            <!-- Вкладка Зад -->
            <div id="view-courses">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Доступные модули</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="courses-list"></div>
            </div>

            <!-- Вкладка Табл -->
            <div id="view-leaderboard" class="hidden">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Рейтинг студентов</h2>
                <div class="bg-white rounded-lg shadow border overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-gray-500 border-b">
                            <tr>
                                <th class="py-3 px-4">Место</th>
                                <th class="py-3 px-4">Студент</th>
                                <th class="py-3 px-4">Уровень</th>
                                <th class="py-3 px-4 text-right">Очки (PTS)</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body"></tbody>
                    </table>
                </div>
            </div>

            <!-- Вкладка Дост -->
            <div id="view-achievements" class="hidden">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Награды и бейджи</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="achievements-list"></div>
            </div>
        </main>
    </div>
    
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 flex justify-center items-center px-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full p-6 shadow-xl relative">
            <button id="btn-close-modal" type="button" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            <h3 id="modal-task-title" class="text-lg font-bold text-gray-800 mb-2"></h3>
            <p id="modal-task-desc" class="text-sm text-gray-600 mb-4"></p>
            <div id="modal-task-content" class="mb-6"></div>
            <div class="flex justify-end space-x-3">
                <button id="btn-cancel-modal" type="button" class="px-4 py-2 border rounded text-sm text-gray-600 hover:bg-gray-50">Отмена</button>
                <button id="btn-submit-task" type="button" class="px-4 py-2 bg-indigo-600 text-white rounded text-sm hover:bg-indigo-700">Отправить ответ</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
